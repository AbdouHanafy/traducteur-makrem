name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/makram_arfaoui_ci
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXTAUTH_URL: https://ci.example.test
      PRIVATE_STORAGE_ROOT: /tmp/makram-arfaoui-private-storage
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint and type-check
        run: npm run check

      - name: Build
        run: npm run build
